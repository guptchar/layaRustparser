[workspace]
members = [
    "crates/ulpf-core",
    "crates/ulpf-integrity",
    "crates/ulpf-ai",
    "crates/ulpf-generator",
    "crates/ulpf-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ULPF Team"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aho-corasick = "1.1"
sha2 = "0.11"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
arrow = { version = "60.0", features = ["prettyprint"] }
parquet = { version = "60", features = ["arrow"] }
rand = "0.8"
anyhow = "1.0"
thiserror = "2.0"
hex = "0.4"
socket2 = { version = "0.6", features = ["all"] }
bytes = "1.0"
libc = "0.2"
