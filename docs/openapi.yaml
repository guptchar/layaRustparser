openapi: 3.0.3
info:
  title: ULPF Air-Gapped High-Performance REST API
  description: Backend API for the Universal Log Pre-processing Framework serving Analyst Dashboard, Investigation, and Management UI.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local air-gapped development server
paths:
  /metrics:
    get:
      summary: Live Telemetry & Vendor Mix
      description: |
        Returns measured throughput, latency percentiles, queue depth, LRU hit
        rate, per-vendor parsed counts, and disposition breakdown.

        **Every value is measured. Unmeasured values are `null`, never `0` and
        never a placeholder constant.** A consumer must distinguish three
        states: a measured value, `0` (traffic observed, rate genuinely zero),
        and `null` (nothing measured). The `telemetry_state` field names the
        third case explicitly.

        Live gauges come from the ingest process, which publishes a telemetry
        sidecar next to the ledger; this process cannot observe the ingest task
        graph directly. `ulpf serve` and `ulpf ingest` are separate processes.
        When the sidecar is absent or older than the staleness bound, the live
        gauges report `null` and `telemetry_state` becomes `STALE` or
        `ABSENT` — a stale reading is never presented as a live one.
      responses:
        '200':
          description: Telemetry data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /alerts:
    get:
      summary: Security & Anomaly Alerts Feed
      description: |
        Returns alerts derived from real events only — currently tamper alarms
        from block verification against the Merkle ledger.

        The feed is empty when nothing has actually happened. It is never
        populated with synthetic entries to make a demo look busy.
      responses:
        '200':
          description: List of active alerts
  /blocks:
    get:
      summary: Ledger Archive Blocks List
      description: Lists all blocks recorded in append-only Merkle ledger with PASS/FAIL audit status.
      responses:
        '200':
          description: Blocks retrieved
  /blocks/{id}/records:
    get:
      summary: Block Forensic Records Query
      description: Paginated search over Parquet records with raw log and OCSF 1.3 split view.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: vendor
          in: query
          schema:
            type: string
        - name: disposition
          in: query
          schema:
            type: string
        - name: ip
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Records retrieved successfully
        '404':
          description: Block not found
  /prove/{block}/{leaf}:
    get:
      summary: RFC 6962 Merkle Inclusion Proof (Stub / Preview)
      description: Intentional contract stub returning 501 Not Implemented by default per Issue #12 criteria; pass ?live=true for preview audit path reconstruction. Full cryptographic proof verification workflows are scheduled for Issue #14.
      parameters:
        - name: block
          in: path
          required: true
          schema:
            type: integer
        - name: leaf
          in: path
          required: true
          schema:
            type: integer
        - name: live
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Preview proof generated successfully
        '501':
          description: Contract stub response (501 Not Implemented per Issue #12, pending Issue #14)
  /export/bundle/{id}:
    get:
      summary: Courtroom Evidence Bundle Export
      description: Generates self-describing .tar.gz archive with block Parquet, ledger line, and checksums.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tar.gz archive download
          content:
            application/gzip:
              schema:
                type: string
                format: binary
  /parsers:
    get:
      summary: List Registered Parsers
      description: Lists built-in native extractors and dynamic onboarded parsers.
      responses:
        '200':
          description: List of parsers
  /parsers/test:
    post:
      summary: Dry-Run Single Line Parser Test
      description: Tests single log line against existing or ad-hoc regex without writing to disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_log
              properties:
                raw_log:
                  type: string
                vendor:
                  type: string
                regex_pattern:
                  type: string
      responses:
        '200':
          description: Test execution result
  /onboard:
    post:
      summary: 1-Click Parser Onboarding Wizard
      description: Synthesizes regex parser from sample lines. Preview mode if confirm=false; persists and hot-loads if confirm=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendor
                - sample_lines
              properties:
                vendor:
                  type: string
                device_model:
                  type: string
                sample_lines:
                  type: array
                  items:
                    type: string
                confirm:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Parser preview generated
        '201':
          description: Parser hot-loaded and persisted
  /tamper/drill:
    post:
      summary: Isolated Adversarial Tamper Drill
      description: Safely clones evidence block to scratch directory and tampers only the clone to generate alarm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - block_id
              properties:
                block_id:
                  type: integer
                leaf_index:
                  type: integer
                  default: 0
                spoofed_ip:
                  type: string
                  default: "10.99.99.99"
                confirm:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Tamper drill result
  /system:
    get:
      summary: System Settings & Benchmarks
      description: Returns batcher config, queue depth, and comparative scorecard.
      responses:
        '200':
          description: System status retrieved

components:
  schemas:
    MetricsResponse:
      type: object
      description: |
        Measured pipeline telemetry. Fields that could not be measured are
        `null`; they are never defaulted to `0` or to a plausible constant.
      properties:
        eps:
          type: number
          format: double
          nullable: true
          description: |
            Measured events per second. `null` when no traffic has been
            observed. Note `0` and `null` differ: `0` means traffic was
            observed and the rate was genuinely zero.
        latency_p50_micros:
          type: number
          format: double
          nullable: true
          description: Median per-line parse latency over the rolling window.
        latency_p99_micros:
          type: number
          format: double
          nullable: true
          description: 99th percentile of the same rolling window.
        latency_samples:
          type: integer
          format: int64
          description: |
            Samples currently behind the latency window, so the percentiles can
            be judged representative or not.
        lru_hit_rate:
          type: number
          format: double
          nullable: true
          description: |
            Parser signature-cache hit ratio, aggregated across parse workers
            from summed hits and lookups. `null` until at least one lookup has
            occurred.
        lru_lookups:
          type: integer
          format: int64
          nullable: true
          description: Lookups behind `lru_hit_rate`, so the ratio is auditable.
        queue_depth:
          type: integer
          nullable: true
          description: Messages queued in the bounded ingest queue.
        queue_capacity:
          type: integer
          nullable: true
          description: Configured bound on `queue_depth`.
        dropped_count:
          type: integer
          format: int64
          nullable: true
          description: Cumulative lines shed by the drop-newest policy.
        total_ingested:
          type: integer
          format: int64
          nullable: true
        total_parsed:
          type: integer
          format: int64
          nullable: true
        total_blocks:
          type: integer
          format: int64
          nullable: true
          description: Merkle blocks anchored, from the persisted ledger.
        total_anomalies:
          type: integer
          format: int64
          nullable: true
        vendor_mix:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            Per-vendor parsed **counts** from the live event stream, not
            percentages — a percentage with no stated base is misleading. An
            empty object means no vendor has been parsed by the running ingest
            process. It is never back-filled with a placeholder distribution.
        disposition_breakdown:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            Disposition counts over a bounded sample of the persisted corpus.
            Only dispositions actually present appear; an empty corpus yields
            an empty object rather than zeroed placeholders.
        disposition_sampled:
          type: integer
          format: int64
          description: Records behind `disposition_breakdown`, so its base is known.
        telemetry_state:
          type: string
          enum: [LIVE, STALE, ABSENT]
          description: |
            Whether the live gauges are current.
            * `LIVE` — fresh snapshot from a running ingest process.
            * `STALE` — a snapshot exists but is older than the staleness bound,
              or its writer exited.
            * `ABSENT` — ingest has never run; there is nothing to report.
        telemetry_age_ms:
          type: integer
          format: int64
          nullable: true
          description: Age of the underlying snapshot, or `null` when absent.
        disposition_source:
          type: string
          description: Provenance of the disposition counts, so their base is explicit.
        status:
          type: string
          enum: [HEALTHY, DEGRADED, IDLE, UNKNOWN]
          description: |
            Pipeline health derived from real signals, never a constant.
            `HEALTHY`/`DEGRADED` require live telemetry with a measured drop
            count. `IDLE` means a live pipeline stopped publishing. `UNKNOWN`
            means live telemetry is unavailable — including when ingest has
            never run, which is deliberately **not** reported as healthy.
